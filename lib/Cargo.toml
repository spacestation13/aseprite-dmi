[package]
name = "aseprite-dmi"
version = "2.0.2"
edition = "2024"
rust-version = "1.96"
repository = "https://github.com/spacestation13/aseprite-dmi"

[lib]
name = "dmi"
crate-type = ["cdylib", "lib"]

[dependencies]
anyhow = "1.0"
arboard = "3.7"
base64 = "0.23.1"
image = { version = "0.25.10", default-features = false, features = ["png"] }
mlua = { version = "0.12.3", features = ["module", "lua54", "serialize"] }
native-dialog = "0.9"
png = "0.18.1"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "native-tls"] }
sanitize-filename = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = { version = "0.40.4", default-features = false, features = ["system"] }
thiserror = "2.0"
open = "5.4"

# Statically link OpenSSL for distros without OpenSSL 3.
[target.'cfg(target_os = "linux")'.dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls-vendored"] }

[build-dependencies]
cc = "1.2"
